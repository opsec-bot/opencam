name: build-and-publish

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "Space-separated region ids, or blank for all"
        required: false
        default: ""

# Pages is served from the gh-pages branch, so this job commits the freshly
# built dataset there. It needs write access to push that branch.
permissions:
  contents: write

concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build packs
        env:
          # Set repo variable OPENCAM_OVERPASS_ENDPOINT to a mirror if the
          # public Overpass server rate-limits the runner.
          OPENCAM_OVERPASS_ENDPOINT: ${{ vars.OPENCAM_OVERPASS_ENDPOINT }}
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python -m opencam.build --out dist --base-url "$BASE" --regions ${{ github.event.inputs.regions }}

      - name: Summary
        run: |
          python - <<'PY'
          import json
          m = json.load(open("dist/manifest.json"))
          total = sum(r["cameraCount"] for r in m["regions"])
          print(f"{len(m['regions'])} regions, {total} cameras, generated {m['generatedAt']}")
          PY

      - name: Publish dataset to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "opencam-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Rebuild dataset $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
