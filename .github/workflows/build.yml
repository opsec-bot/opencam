name: build-and-publish

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "Space-separated region ids, or blank for all"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build packs
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python -m opencam.build --out dist --base-url "$BASE" --regions ${{ github.event.inputs.regions }}

      - name: Show manifest summary
        run: |
          python - <<'PY'
          import json
          m = json.load(open("dist/manifest.json"))
          total = sum(r["cameraCount"] for r in m["regions"])
          print(f"{len(m['regions'])} regions, {total} cameras, generated {m['generatedAt']}")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
